[unix_http_server]
file=/var/run/supervisor.sock
chmod=0770

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
pidfile=/var/run/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:queue-worker-redis]
process_name=redis_worker_%(process_num)02d
; --queue=high,default: the "high" queue (email alerts, etc.) is always drained
; before "default" (heavy Python-backed sync jobs), so a slow/hanging VCI call
; never delays a time-sensitive notification.
; --tries/--timeout must stay in sync with config/queue.php's
; connections.redis.retry_after (currently 660s) — retry_after must always be
; comfortably ABOVE --timeout, or Redis releases a still-running job back onto
; the queue as if its worker crashed, causing a second worker to pick up the
; same job and duplicate-attempt it into a false MaxAttemptsExceededException
; (this happened for real — see docs/HISTORY.md, QUEUE_MONITORING_HORIZON).
; numprocs=6 (was 3): these jobs are I/O-bound (waiting on the VCI/KBS APIs, not
; CPU), so more workers process more chunks concurrently for near-free — no
; app-level bottleneck to it. Combined with py/get_stock.py's own MAX_CONCURRENT=4
; internal thread pool, worst-case concurrent requests to VCI goes from 3
; (today, 1 request/worker) to 24 (6 workers x 4 threads) — a deliberately
; bounded increase, not "as many as possible", since pushing this further risks
; harder rate-limiting from VCI, which would hurt more than help. Tune both
; numbers together if sync speed still isn't enough — watch Admin > Giám sát
; Queue while doing it. See docs/PYTHON_INTEGRATION.md.
command=php /var/www/html/artisan queue:work redis --queue=high,default --sleep=3 --tries=3 --timeout=600 --max-time=3600
autostart=true
autorestart=true
numprocs=6
redirect_stderr=true
stdout_logfile=/var/log/supervisor/redis_worker_%(process_num)02d.log
stdout_logfile_maxbytes=5MB
stopwaitsecs=600
