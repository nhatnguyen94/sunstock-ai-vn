[unix_http_server]
file=/var/run/supervisor.sock
chmod=0770

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
pidfile=/var/run/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; ── Horizon: manages the Redis queue workers itself (see config/horizon.php
; for process count/queue priority/tries/timeout — mirrors the old manual
; `queue:work redis --queue=high,default --tries=3 --timeout=600` flags).
; Only ONE supervisor program is needed here; Horizon spawns/monitors its own
; worker child processes internally. Dashboard: /horizon (gate: manage-queue,
; see app/Providers/HorizonServiceProvider.php and docs/RBAC.md).
[program:horizon]
process_name=horizon
command=php /var/www/html/artisan horizon
autostart=true
autorestart=true
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/horizon.log
stdout_logfile_maxbytes=5MB
stopsignal=TERM
stopwaitsecs=600
