; Custom PHP settings for stock-app
upload_max_filesize = 50M
post_max_size = 50M
memory_limit = 512M
max_execution_time = 300
max_input_time = 300

; OPcache (dev: validate timestamps; prod: set validate_timestamps = 0 for performance)
; revalidate_freq = 2: a changed file is picked up within 2 seconds, but the ~150 scripts of a request are no longer stat()ed on EVERY request —
; over the Windows bind mount one stat costs milliseconds (measured: 361 files = 1.1 s vs 5 ms on the container's own disk), so this alone
; makes a page 35–45 % faster. Set it back to 0 if an edit must show instantly.
opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

; Resolved file paths are cached by PHP itself (default TTL is only 120 s)
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Dev only: every file PHP creates (compiled views, logs) is writable by every user of the container, so php-fpm (www-data) and
; `docker compose exec` (root) can never lock each other out of a file. Switched on by PHP_DEV_UMASK=1 in docker-compose.yml.
auto_prepend_file = /usr/local/etc/php/dev-umask.php

; Do not advertise the PHP version in an X-Powered-By header
expose_php = Off
