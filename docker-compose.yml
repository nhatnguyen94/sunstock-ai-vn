services:

  # ── Nginx: HTTPS reverse proxy ───────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - ./public:/var/www/html/public:ro   # serve static files without going to PHP
    depends_on:
      - php
    networks:
      - stocknet
    restart: unless-stopped

  # ── PHP-FPM: Laravel app + Python ───────────────────────────────────────────
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/var/www/html                                          # code mount (dev)
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/99-custom.ini:ro
      - vendor_data:/var/www/html/vendor                        # vendor in named volume (faster on Windows)
      - ../database_backup:/backups                             # weekly DB backups live BESIDE the project, outside Docker storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - PYTHONIOENCODING=utf-8
      - VNSTOCK_DISABLE_AGENT_SETUP=1              # vnai must not write instructions into AGENTS.md / ~/.claude/CLAUDE.md
      - DB_BACKUP_PATH=/backups
    networks:
      - stocknet
    restart: unless-stopped

  # ── MySQL 8.0 ────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-stock_app}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD must be set in .env — no insecure default}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3307:3306"   # localhost-only: avoid exposing MySQL to the LAN/internet
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:?DB_PASSWORD must be set in .env}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stocknet
    restart: unless-stopped

  # ── Redis 7 ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - stocknet
    restart: unless-stopped

  # ── Queue workers (6 parallel via Supervisor) ────────────────────────────────
  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: ["/usr/bin/supervisord", "-c", "/etc/supervisor/conf.d/supervisord.conf"]
    volumes:
      - .:/var/www/html
      - ./docker/php/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf:ro
      - vendor_data:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - PYTHONIOENCODING=utf-8
      - VNSTOCK_DISABLE_AGENT_SETUP=1              # vnai must not write instructions into AGENTS.md / ~/.claude/CLAUDE.md
    networks:
      - stocknet
    restart: unless-stopped

  # ── Scheduler (startup sync + php artisan schedule:work) ─────────────────────
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: ["sh", "/var/www/html/docker/php/scheduler-entrypoint.sh"]
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      - ../database_backup:/backups                             # weekly DB backups (db:backup) — see docs/DOCKER.md
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - PYTHONIOENCODING=utf-8
      - VNSTOCK_DISABLE_AGENT_SETUP=1              # vnai must not write instructions into AGENTS.md / ~/.claude/CLAUDE.md
      - DB_BACKUP_PATH=/backups
    networks:
      - stocknet
    restart: unless-stopped

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  mysql_data:
  redis_data:
  vendor_data:    # isolates vendor/ from Windows filesystem (much faster)

# ── Network ───────────────────────────────────────────────────────────────────
networks:
  stocknet:
    driver: bridge
